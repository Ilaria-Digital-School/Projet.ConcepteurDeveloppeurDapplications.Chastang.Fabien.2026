<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.png">
    <title>Inscription - My Shop</title>

    <!-- CSS files -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="page-container">
        <header>
            <!-- Titre principal – Info : Créez votre compte -->
            <h1>My Shop</h1>

            <!-- Menu de navigation -->
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <button class="navbar-toggler btn-burger" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li><a href="../index.html">Accueil</a></li>
                            <li><span class="selected-page">Inscription</span></li>
                            <li><a href="login.html">Connexion</a></li>
                            <li><a href="products.html">Articles</a></li>
                            <li><a href="shopping.html">Panier</a></li>
                            <li><a href="contact.html">Contact</a></li>
                            <li><a href="about.html">À propos</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section>
                <!-- Formulaire d'inscription -->
                <form class="form">
                    <h2>Inscription</h2>

                    <fieldset>
                        <legend>Informations personnelles</legend>
                        <div>
                            <label for="name">Nom&nbsp;:</label>
                            <input type="text" name="name" id="name" placeholder="Votre nom" required>
                        </div>
                        <div>
                            <label for="email">E-mail&nbsp;:</label>
                            <input type="email" name="email" id="email" placeholder="votre@adresse.email" required>
                        </div>
                        <div>
                            <label for="psw">Mot de passe&nbsp;:</label>
                            <input type="password" name="psw" id="psw" autocomplete="new-password" placeholder="Votre mot de passe" required>
                            <input type="password" name="psw-confirm" id="psw-confirm" autocomplete="new-password" placeholder="Confirmez de votre mot de passe" aria-label="Confirmez de votre mot de passe" required>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Informations supplémentaires</legend>
                        <div class="field-container">
                            <div class="field-label" aria-label="Genre">Genre&nbsp;:&nbsp;</div>
                            <span class="fields">
                                <div class="field">
                                    <input type="radio" name="genre" id="femme" value="femme">
                                    <label for="femme"> Femme&nbsp;</label>
                                </div>
                                <div class="field">
                                    <input type="radio" name="genre" id="homme" value="homme">
                                    <label for="homme"> Homme</label>
                                </div>
                            </span>
                        </div>
                        <div class="field-container">
                            <div class="field-label" aria-label="Intérêts">Intérêts&nbsp;:&nbsp;</div>
                            <span class="fields">
                                <div class="field">
                                    <input type="checkbox" name="interets" id="vetements" value="vetements">
                                    <label for="vetements"> Vêtements&nbsp;</label>
                                </div>
                                <div class="field">
                                    <input type="checkbox" name="interets" id="accessoires" value="accessoires">
                                    <label for="accessoires"> Accessoires </label>
                                </div>
                            </span>
                        </div>
                        <div>
                            <label for="pays">Pays&nbsp;:</label>
                            <select name="pays" id="pays">
                                <option value="Canada">Canada</option>
                                <option value="Chine">Chine</option>
                                <option value="Espagne">Espagne</option>
                                <option value="États-Unis">États-Unis</option>
                                <option value="France" selected>France</option>
                                <option value="Italie">Italie</option>
                                <option value="Japon">Japon</option>
                                <option value="Royaume-Uni">Royaume-Uni</option>
                                <option value="Tunisie">Tunisie</option>
                                <option value="Autre">– Autre –</option>
                            </select>
                        </div>
                    </fieldset>

                    <div class="div-button">
                        <button type="submit">S'inscrire</button>
                        <button type="reset">Effacer</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <button id="SCROLL_TOP" title="Retour en haut de la page" aria-label="Retour en haut de la page"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Pied de la page -->
    <footer>
        <h2>Contactez-nous :</h2>
        <p>
            <a href="https://www.linkedin.com/in/fabien-chastang/" target="_blank"><i class="fa-brands fa-square-linkedin"></i>LinkedIn</a>
            <a href="https://github.com/fabien-chastang" target="_blank"><i class="fa-brands fa-github"></i>GitHub</a>
            <span class="copyright">Copyright © <span id="COPYRIGHT_YEAR"></span> My Shop</span>
        </p>
    </footer>

    <!-- JavaScript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
