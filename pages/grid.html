<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.png">
    <title>Native – GRID – My Shop</title>

    <!-- Liens vers les fichiers CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <main>
        <section>
            <div class="grid-container">
                <div>
                    <article class="article-product">
                        <h3>Chemise</h3>
                        <i class="fa-solid fa-heart-circle-check article-favorite"></i>
                        <p>Ce produit est <span>fortement recommandé</span> par nos clients</p>
                        <div>
                            <img src="../assets/img/clothing/men/shirts/cms1.png" alt="Chemise homme en bleu">
                        </div>
                        <p>Description Produit 1</p>
                        <p>Prix : 10£</p>
                        <button type="button">Acheter</button>
                    </article>
                </div>
                <div>
                    <article class="article-product">
                        <h3>Robe</h3>
                        <span class="article-new">New</span>
                        <div>
                            <img src="../assets/img/clothing/women/dresses/cwd1.png" alt="Robe en jean">
                        </div>
                        <p>Description de l'article</p>
                        <p>Prix : 20£</p>
                        <button type="button">Acheter</button>
                    </article>
                </div>
                <div>
                    <article class="article-product" id="test">
                        <h3>Robe</h3>
                        <span class="article-badge">Promo</span>
                        <div>
                            <img src="../assets/img/clothing/women/dresses/cwd2.png" alt="Robe en jean">
                        </div>
                        <p>Description de l'article</p>
                        <p>Prix : 20£</p>
                        <button type="button">Acheter</button>
                    </article>
                </div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>
                <div>8</div>
            </div>
        </section>
    </main>
</body>

</html>
