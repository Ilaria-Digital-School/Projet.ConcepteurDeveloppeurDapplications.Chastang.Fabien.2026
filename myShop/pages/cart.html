<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.png">
    <title>Panier – My Shop</title>

    <!-- CSS files -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="page-container">
        <header>
            <!-- Titre principal – Slogan : Habillez chaque moment avec style -->
            <h1>My Shop</h1>

            <!-- Menu de navigation -->
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <button class="navbar-toggler btn-burger" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li><a href="../index.html">Accueil</a></li>
                            <li><a href="addUser.html">Inscription</a></li>
                            <li><a href="login.html">Connexion</a></li>
                            <li><a href="products.html">Articles</a></li>
                            <li><span class="selected-page">Panier</span></li>
                            <li><a href="addProduct.html">Nouvel Article</a></li>
                            <li><a href="contact.html">Contact</a></li>
                            <li><a href="about.html">À propos</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main-shopping">
            <!-- Présentation du site -->
            <section>
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Produit</th>
                                <th scope="col">Prix</th>
                                <th scope="col">Quantité</th>
                                <th scope="col">Total</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>

                        <tbody class="table-group-divider">
                            <tr>
                                <th scope="row">1</th>
                                <td>Produit 1</td>
                                <td>20€</td>
                                <td>1</td>
                                <td>20€</td>
                                <td>
                                    <button type="button" class="btn btn-danger" title="Supprimer" aria-label="Supprimer">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row">2</th>
                                <td>Produit 2</td>
                                <td>15€</td>
                                <td>3</td>
                                <td>45€</td>
                                <td>
                                    <button type="button" class="btn btn-danger" title="Supprimer" aria-label="Supprimer">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row">3</th>
                                <td>Produit 3</td>
                                <td>10€</td>
                                <td>4</td>
                                <td>40€</td>
                                <td>
                                    <button type="button" class="btn btn-danger" title="Supprimer" aria-label="Supprimer">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="4">Total</td>
                                <td>105€</td>
                                <td>
                                    <button type="button" class="btn btn-success" title="Commander" aria-label="Commander">
                                        <i class="fa-brands fa-cc-visa"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <button id="scroll-top" title="Retour en haut de la page" aria-label="Retour en haut de la page"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Pied de la page -->
    <footer>
        <h2>Contactez-nous :</h2>
        <p>
            <a href="https://www.linkedin.com/in/fabien-chastang/" target="_blank"><i class="fa-brands fa-square-linkedin"></i>LinkedIn</a>
            <a href="https://github.com/fabien-chastang" target="_blank"><i class="fa-brands fa-github"></i>GitHub</a>
            <span class="copyright">Copyright © <span id="copyright-year"></span> My Shop</span>
        </p>
    </footer>

    <!-- JavaScript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/cart.js"></script>
</body>

</html>
