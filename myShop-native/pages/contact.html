<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.png">
    <title>Contactez-nous – My Shop</title>

    <!-- CSS files -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="page-container">
        <header>
            <!-- Main title – Info: Contact us -->
            <h1>My Shop</h1>

            <!-- Navigation menu -->
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <button class="navbar-toggler btn-burger" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 menu">
                            <li><a href="../index.html" title="Accueil" aria-label="Accueil"><i class="fa-regular fa-house"></i></a></li>
                            <li><a href="products.html">Nos Articles</a></li>
                            <li id="navbar-add-product" class="inactive"><a href="addProduct.html">Nouvel Article</a></li>
                            <li>
                                <a href="cart.html" title="Mon panier" aria-label="Mon panier"><i class="fa-solid fa-cart-arrow-down"></i></a>
                                <span id="cart-sticker"></span>
                            </li>
                            <li>
                                <a href="#" aria-label="Mon profile"><i class="fa-regular fa-circle-user"></i></a>
                                <ul class="submenu">
                                    <li><a href="login.html">Connexion</a></li>
                                    <li><a href="addUser.html">Inscription</a></li>
                                    <li><a href="orders.html">Commandes</a></li>
                                    <li><a href="javascript:logout()"><i class="fa-solid fa-power-off"></i>Déconnexion</a></li>
                                </ul>
                            </li>
                            <li><span class="selected-page" title="Contactez-nous" aria-label="Contactez-nous"><i class="fa-regular fa-envelope"></i></span></li>
                            <li><a href="about.html" title="À propos de My Shop" aria-label="À propos de My Shop"><i class="fa-solid fa-circle-info"></i></a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main-contact">
            <!-- Formulaire de contact -->
            <section>
                <form class="form">
                    <h2>Contactez-nous</h2>

                    <div>
                        <label for="name-user">Nom&nbsp;:</label>
                        <input type="text" name="name-user" id="name-user" placeholder="Votre nom" required>
                    </div>
                    <div>
                        <label for="email-user">E-mail&nbsp;:</label>
                        <input type="email" name="email-user" id="email-user" placeholder="votre@adresse.email" required>
                    </div>
                    <div>
                        <label for="msg-user">Message&nbsp;:</label>
                        <textarea name="msg-user" id="msg-user" placeholder="Votre message" rows="4" required></textarea>
                    </div>
                    <div class="div-button">
                        <button type="submit">Envoyer</button>
                        <button type="reset" title="Effacer" aria-label="Effacer"><i class="fa-solid fa-eraser"></i></button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <button id="scroll-top" title="Retour en haut de la page" aria-label="Retour en haut de la page"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Pied de la page -->
    <footer>
        <h2>Retrouvez-nous :</h2>
        <p>
            <a href="https://www.linkedin.com/in/fabien-chastang/" target="_blank"><i class="fa-brands fa-square-linkedin"></i>LinkedIn</a>
            <a href="https://github.com/fabien-chastang" target="_blank"><i class="fa-brands fa-github"></i>GitHub</a>
            <span class="copyright">Copyright © <span id="copyright-year"></span> My Shop</span>
        </p>
    </footer>

    <!-- JavaScript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
