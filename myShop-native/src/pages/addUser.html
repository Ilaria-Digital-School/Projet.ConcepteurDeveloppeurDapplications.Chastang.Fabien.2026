<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.png" />
    <title>Inscription – My Shop</title>

    <!-- CSS files -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <div class="wrapper">
      <header></header>

      <main id="main-add-user">
        <section>
          <!-- User registration form -->
          <form class="form">
            <h2>Inscription</h2>

            <fieldset>
              <legend>Informations personnelles</legend>
              <div>
                <label for="name-user">Nom&nbsp;:</label>
                <input
                  type="text"
                  name="name-user"
                  id="name-user"
                  placeholder="Votre nom"
                  required
                />
              </div>
              <div>
                <label for="email-user">E-mail&nbsp;:</label>
                <input
                  type="email"
                  name="email-user"
                  id="email-user"
                  placeholder="votre@adresse.email"
                  required
                />
              </div>
              <div>
                <label for="password-user">Mot de passe&nbsp;:</label>
                <input
                  type="password"
                  name="password-user"
                  id="password-user"
                  autocomplete="new-password"
                  placeholder="Votre mot de passe"
                  required
                />
                <input
                  type="password"
                  name="password-confirm"
                  id="password-confirm"
                  autocomplete="new-password"
                  placeholder="Confirmez de votre mot de passe"
                  aria-label="Confirmez de votre mot de passe"
                  required
                />
              </div>
            </fieldset>

            <fieldset>
              <legend>Informations supplémentaires</legend>
              <div class="field-container">
                <div class="field-label" aria-label="Genre">Genre&nbsp;:&ensp;</div>
                <span id="gender-container"></span>
              </div>
              <div class="field-container">
                <div class="field-label" aria-label="Intérêts">Intérêts&nbsp;:&ensp;</div>
                <span id="interests-container"></span>
              </div>
              <div>
                <label for="country-user">Pays&nbsp;:</label>
                <select name="country-user" id="country-user"></select>
              </div>
            </fieldset>

            <div class="div-button">
              <button type="submit">S'inscrire</button>
              <button type="reset" title="Effacer" aria-label="Effacer">
                <i class="fa-solid fa-eraser"></i>
              </button>
            </div>

            <div>
              <p>
                Vous avez déjà un compte ?
                <a href="login.html">Se connecter</a>
              </p>
            </div>
          </form>
        </section>
      </main>
    </div>

    <!-- JavaScript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/user.js"></script>
    <script src="../assets/js/examples/exercices.js"></script>
  </body>
</html>
