<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/myShop-native/assets/img/favicon/favicon.png" />
    <title>Connexion – My Shop</title>

    <!-- CSS files -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <div class="wrapper">
      <header></header>

      <main id="main-login">
        <section>
          <!-- Login form -->
          <form class="form">
            <h2>Connexion</h2>

            <div>
              <label for="email-user">E-mail&nbsp;:</label>
              <input
                type="email"
                name="email-user"
                id="email-user"
                placeholder="votre@adresse.email"
                required
              />
            </div>
            <div>
              <label for="password-user">Mot de passe&nbsp;:</label>
              <input
                type="password"
                name="password-user"
                id="password-user"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                required
              />
            </div>
            <div>
              <input type="checkbox" name="permanent-login" id="permanent-login" value="1" />
              <label for="permanent-login"> Restez connecté.e</label>
            </div>
            <div class="div-button">
              <button type="submit">Se connecter</button>
              <button type="reset" title="Effacer" aria-label="Effacer">
                <i class="fa-solid fa-eraser"></i>
              </button>
            </div>

            <div>
              <p>
                Vous n'avez pas encore un compte ?
                <a href="addUser.html">S'inscrire</a>
              </p>
            </div>
          </form>
        </section>
      </main>
    </div>

    <!-- JavaScript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/user.js"></script>
  </body>
</html>
