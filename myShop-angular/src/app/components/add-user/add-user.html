<section>
    <!-- User registration form -->
    <form class="form">
        <h2>Inscription</h2>

        <fieldset>
            <legend>Informations personnelles</legend>
            <div>
                <label for="name-user">Nom&nbsp;:</label>
                <input type="text" name="name-user" id="name-user" placeholder="Votre nom" required>
            </div>
            <div>
                <label for="email-user">E-mail&nbsp;:</label>
                <input type="email" name="email-user" id="email-user" placeholder="votre@adresse.email" required>
            </div>
            <div>
                <label for="password-user">Mot de passe&nbsp;:</label>
                <input type="password" name="password-user" id="password-user" autocomplete="new-password" placeholder="Votre mot de passe" required>
                <input type="password" name="password-confirm" id="password-confirm" autocomplete="new-password" placeholder="Confirmez de votre mot de passe" aria-label="Confirmez de votre mot de passe" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Informations supplémentaires</legend>
            <div class="field-container">
                <div class="field-label" aria-label="Genre">Genre&nbsp;:&ensp;</div>
                <span id="gender-container" class="fields"></span>
            </div>
            <div class="field-container">
                <div class="field-label" aria-label="Intérêts">Intérêts&nbsp;:&ensp;</div>
                <span id="interests-container" class="fields"></span>
            </div>
            <div>
                <label for="country-user">Pays&nbsp;:</label>
                <select name="country-user" id="country-user"></select>
            </div>
        </fieldset>

        <div class="div-button">
            <button type="submit">S'inscrire</button>
            <button type="reset" title="Effacer" aria-label="Effacer"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </form>
</section>
