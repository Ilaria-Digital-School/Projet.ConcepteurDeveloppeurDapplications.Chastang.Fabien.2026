<section>
  <h2 class="h2-title">Nos Articles</h2>

  <div class="product-container">
    @for (product of products; track product.id; let i = $index) {
      <app-product-card
        [product]="product"
        [isList]="1"
        [isSearch]="0"
        (viewEvent)="view($event)"
      ></app-product-card>
    } @empty {
      <p>Aucun article n'est référencé</p>
    }
  </div>
</section>
