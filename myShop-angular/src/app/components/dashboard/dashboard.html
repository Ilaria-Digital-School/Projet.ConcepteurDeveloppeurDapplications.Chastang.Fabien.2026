<section>
  <ul class="nav nav-tabs" id="myTab" role="tablist">
    <li class="nav-item" role="presentation">
      <a
        [class]="'nav-link pointer' + (from === 0 ? ' active' : '')"
        id="users-tab"
        data-bs-toggle="tab"
        data-bs-target="#users-tab-pane"
        role="tab"
        aria-controls="users-tab-pane"
        aria-selected="true"
      >
        Users
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a
        [class]="'nav-link pointer' + (from === 1 ? ' active' : '')"
        id="products-tab"
        data-bs-toggle="tab"
        data-bs-target="#products-tab-pane"
        role="tab"
        aria-controls="products-tab-pane"
        aria-selected="false"
      >
        Products
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a
        [class]="'nav-link pointer' + (from === 2 ? ' active' : '')"
        id="orders-tab"
        data-bs-toggle="tab"
        data-bs-target="#orders-tab-pane"
        role="tab"
        aria-controls="orders-tab-pane"
        aria-selected="false"
      >
        Orders
      </a>
    </li>
  </ul>
  <div class="tab-content" id="myTabContent">
    <div
      [class]="'tab-pane fade show' + (from === 0 ? ' active' : '')"
      id="users-tab-pane"
      role="tabpanel"
      aria-labelledby="users-tab"
      tabindex="0"
    >
      <app-users-table></app-users-table>
    </div>
    <div
      [class]="'tab-pane fade show' + (from === 1 ? ' active' : '')"
      id="products-tab-pane"
      role="tabpanel"
      aria-labelledby="products-tab"
      tabindex="0"
    >
      <app-products-table></app-products-table>
    </div>
    <div
      [class]="'tab-pane fade show' + (from === 2 ? ' active' : '')"
      id="orders-tab-pane"
      role="tabpanel"
      aria-labelledby="orders-tab"
      tabindex="0"
    >
      <app-orders-table></app-orders-table>
    </div>
  </div>
</section>
