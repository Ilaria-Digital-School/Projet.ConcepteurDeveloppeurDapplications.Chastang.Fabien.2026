<article [tabindex]="'0'" [class]="'article-product'">
  <span [class]="product.price < 25 ? 'article-good' : 'inactive'">Bonne<br />Affaire</span>
  <span [class]="product.price > 50 ? 'article-top' : 'inactive'">Top<br />Produit</span>
  <h3>{{ product.name }}</h3>
  @if (product.info) {
    <p>
      <span>{{ product.info }}</span>
    </p>
  }
  <div><img [src]="product.img" [alt]="product.name" /></div>
  <p>{{ product.description }}</p>
  <p>Prix: {{ product.price }} €</p>
  @if (isView === 1) {
    <button
      type="button"
      class="btn btn-primary"
      title="Voir"
      aria-label="Voir"
      (click)="view(product.id)"
    >
      <i class="fa-regular fa-eye"></i>
    </button>
  } @else if (isAdmin) {
    <button
      type="button"
      class="btn btn-success"
      title="Modifier"
      aria-label="Modifier"
      (click)="edit(product.id)"
    >
      <i class="fa-solid fa-file-pen"></i>
    </button>
    <button
      type="button"
      class="btn btn-danger"
      title="Supprimer"
      aria-label="Supprimer"
      (click)="remove(product.id)"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  }
</article>
