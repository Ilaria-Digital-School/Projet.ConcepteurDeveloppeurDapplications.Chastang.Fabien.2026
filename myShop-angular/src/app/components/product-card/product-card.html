<article [tabindex]="'0'" [class]="isList === 1 ? 'article-product' : 'article-product-selected'">
  <span [class]="product.price < 25 ? 'article-good' : 'inactive'">Bonne<br />Affaire</span>
  <span [class]="product.price > 50 ? 'article-top' : 'inactive'">Top<br />Produit</span>
  <span [class]="product.additional.isAvailable ? 'article-available' : 'article-unavailable'">
    {{ product.additional.isAvailable ? 'En stock' : 'Indisponible' }}
  </span>
  <h3>{{ product.name }}</h3>
  @if (product.info) {
    <p>
      <span>{{ product.info }}</span>
    </p>
  }
  <div><img [src]="product.img" [alt]="product.name" /></div>
  <p>{{ product.description }}</p>
  <p>Prix: {{ product.price }} €</p>
  @if (isList === 1) {
    <button
      type="button"
      class="btn btn-primary"
      title="Voir"
      aria-label="Voir"
      (click)="view(product.id)"
    >
      <i class="fa-regular fa-eye"></i>
    </button>
  } @else {
    <button
      type="button"
      class="btn btn-primary"
      title="Ajouter au panier"
      aria-label="Ajouter au panier"
      (click)="add(product)"
    >
      <i class="fa-solid fa-cart-arrow-down"></i>
    </button>
  }
</article>
