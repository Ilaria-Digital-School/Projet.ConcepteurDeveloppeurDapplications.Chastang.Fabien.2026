<section class="search">
  <h2 class="h2-title">Nos Articles</h2>

  @if (searchFn === 1) {
    <input type="text" placeholder="Rechercher..." (input)="search($event.target.value)" />
  }
  <div class="product-container">
    @for (product of filteredProducts; track product.id; let i = $index) {
      <app-product-card
        [product]="product"
        [isList]="1"
        (viewEvent)="view($event)"
      ></app-product-card>
    } @empty {
      <p>Aucun article n'est référencé</p>
    }
  </div>
</section>
