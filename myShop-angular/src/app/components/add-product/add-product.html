<section>
  <!-- Product addition form -->
  <form id="productForm" #productForm="ngForm" (ngSubmit)="add(productForm)" class="form">
    <h2>Nouvel Article</h2>

    <div>
      <label for="name">Nom&nbsp;:</label>
      <input
        type="text"
        name="name"
        id="name"
        [(ngModel)]="product.name"
        placeholder="Nom de l'article"
        required
      />
    </div>
    <div>
      <label for="description">Description&nbsp;:</label>
      <textarea
        name="description"
        id="description"
        [(ngModel)]="product.description"
        placeholder="Description de l'article"
        required
      ></textarea>
    </div>
    <div>
      <label for="price">Prix&nbsp;:&nbsp;</label>
      <input
        type="text"
        name="price"
        id="price"
        [(ngModel)]="product.price"
        class="number"
        maxlength="7"
        required
      />
    </div>
    <div>
      <label for="img">Image&nbsp;:</label>
      <input
        type="text"
        name="img"
        id="img"
        [(ngModel)]="product.img"
        placeholder="Chemin de l'image"
        required
      />
    </div>
    <div>
      <label for="info">Information optionnelle&nbsp;:</label>
      <textarea name="info" id="info" [(ngModel)]="product.info"></textarea>
    </div>
    <div class="div-button">
      <button type="submit">Ajouter</button>
      <button type="reset" title="Effacer" aria-label="Effacer">
        <i class="fa-solid fa-eraser"></i>
      </button>
    </div>
  </form>
</section>
